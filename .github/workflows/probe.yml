name: probe-data-sources
on:
  push:
    branches: [claude/probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Webcams near Val Gardena
        run: |
          curl -sS -D - -H "Origin: https://hamutaluziel.github.io" "https://tourism.api.opendatahub.com/v1/WebcamInfo?active=true&latitude=46.548&longitude=11.74&radius=12000&pagesize=12&removenullvalues=true" -o cams.json | head -20
          python3 -c "
          import json;d=json.load(open('cams.json'));print(type(d).__name__, list(d)[:8] if isinstance(d,dict) else len(d))
          it=d.get('Items',d) if isinstance(d,dict) else d
          print('count',len(it))
          for c in it[:6]: print(json.dumps({k:c.get(k) for k in ['Shortname','Source','Active','WebCamProperties','GpsInfo']})[:600]); print('  IMG', [ (i.get('ImageUrl'),i.get('Width')) for i in (c.get('ImageGallery') or [])][:5])
          "
      - name: Webcams without geo filter
        run: |
          curl -sS "https://tourism.api.opendatahub.com/v1/WebcamInfo?pagesize=5&removenullvalues=true" -o all.json
          python3 -c "
          import json;d=json.load(open('all.json'));print(type(d).__name__, {k:d[k] for k in d if k!='Items'} if isinstance(d,dict) else len(d))
          it=d.get('Items',[]) if isinstance(d,dict) else d
          for c in it[:5]: print(c.get('Shortname'), c.get('Source'), c.get('Active'), json.dumps(c.get('WebCamProperties'))[:300], [i.get('ImageUrl') for i in (c.get('ImageGallery') or [])][:3], json.dumps(c.get('GpsInfo'))[:200])
          "
      - name: Measuring points
        run: |
          curl -sS "https://tourism.api.opendatahub.com/v1/Weather/Measuringpoint?active=true&pagesize=300&removenullvalues=true" -o mp.json
          python3 -c "
          import json;d=json.load(open('mp.json'));print(type(d).__name__, len(d) if isinstance(d,list) else list(d)[:6])
          it=d.get('Items',d) if isinstance(d,dict) else d
          for c in it[:4]: print(json.dumps({k:c.get(k) for k in ['Shortname','SnowHeight','newSnowHeight','LastUpdate','LastSnowDate','GpsInfo','Detail']})[:500])
          "
      - name: Open-Meteo
        run: curl -sS -D - -H "Origin: https://hamutaluziel.github.io" "https://api.open-meteo.com/v1/forecast?latitude=46.54&longitude=11.76&current=temperature_2m,snow_depth" | head -30
      - name: Pages status
        run: curl -sS -o /dev/null -w "%{http_code}\n" https://hamutaluziel.github.io/Hamutal/dolomiti/
