name: probe-data-sources
on:
  push:
    branches: [claude/probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Screenshot live page
        run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            for (const [w, name] of [[1280, 'desk'], [400, 'phone']]) {
              const p = await b.newPage({ viewport: { width: w, height: 900 } });
              p.on('console', m => console.log('console:', m.type(), m.text()));
              p.on('pageerror', e => console.log('PAGEERROR', e.message));
              await p.goto('https://raw.githack.com/hamutaluziel/Hamutal/main/dolomiti/index.html', { waitUntil: 'load' });
              await p.waitForTimeout(9000);
              console.log(name, await p.textContent('#updated'), 'imgs', await p.locator('.cams img').count(),
                'loaded', await p.$$eval('.cams img', a => a.filter(i => i.complete && i.naturalWidth > 0).length),
                'empty', await p.locator('.cams .empty').count(), 'official', await p.locator('.g-fill.official').count());
              console.log(await p.$$eval('.g-row', r => r.map(x => x.innerText.replace(/\s+/g, ' ')).join(' | ')));
              await p.screenshot({ path: `shot-${name}.png`, fullPage: name === 'desk' });
              if (name === 'desk') { await p.click('.cams .cam[data-area="gardena"]'); await p.waitForTimeout(4000); await p.screenshot({ path: 'shot-detail.png' }); }
            }
            await b.close();
          })();
          JS
          node shot.js
      - name: Save screenshots
        run: |
          mkdir -p probe-shots && mv shot-*.png probe-shots/
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add probe-shots && git commit -m "probe screenshots" && git push
