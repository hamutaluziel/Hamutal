name: probe-data-sources
on:
  push:
    branches: [claude/probe]
permissions:
  pages: write
  id-token: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Try enabling Pages with workflow token
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pages status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages || true
