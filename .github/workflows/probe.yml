name: probe-data-sources
on:
  push:
    branches: [claude/probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hosting check
        run: |
          for u in "https://raw.githack.com/hamutaluziel/Hamutal/main/dolomiti/index.html" "https://rawcdn.githack.com/hamutaluziel/Hamutal/main/dolomiti/index.html" "https://hamutaluziel.github.io/Hamutal/dolomiti/"; do
            echo "== $u"; curl -sS -L -D - -o page.html "$u" | grep -iE "^HTTP|content-type|content-security|x-frame" ; grep -o "<title>[^<]*" page.html | head -1; grep -c "source: \"dss\"" page.html || true
          done
