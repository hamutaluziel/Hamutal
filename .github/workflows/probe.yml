name: probe-data-sources
on:
  push:
    branches: [claude/probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Screenshot live page
        run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          const T = async (p, f) => { try { return await f(); } catch (e) { return 'ERR ' + e.message.split('\n')[0]; } };
          (async () => {
            const b = await chromium.launch();
            const urls = [['gh', 'https://raw.githack.com/hamutaluziel/Hamutal/main/dolomiti/index.html'], ];
            for (const [tag, url] of urls) for (const [w, name] of [[1280, 'desk'], [400, 'phone']]) {
              const p = await b.newPage({ viewport: { width: w, height: 900 } });
              p.on('console', m => console.log(tag, 'console:', m.type(), m.text().slice(0, 200)));
              p.on('pageerror', e => console.log(tag, 'PAGEERROR', e.message));
              p.on('requestfailed', r => console.log(tag, 'REQFAIL', r.url().slice(0, 120), r.failure() && r.failure().errorText));
              const resp = await T(p, () => p.goto(url, { waitUntil: 'load', timeout: 45000 }));
              await T(p, () => p.click('text=Open the page', { timeout: 8000 }));
              await T(p, () => p.waitForSelector('#updated', { timeout: 20000 }));
              console.log(tag, name, 'status', resp && resp.status ? resp.status() : resp, 'final', p.url());
              await p.waitForTimeout(12000);
              console.log(tag, name, 'title', await p.title(), 'html', (await p.content()).slice(0, 300).replace(/\s+/g, ' '));
              console.log(tag, name, await T(p, () => p.textContent('#updated', { timeout: 2000 })),
                'imgs', await T(p, () => p.locator('.cams img').count()),
                'loaded', await T(p, () => p.$$eval('.cams img', a => a.filter(i => i.complete && i.naturalWidth > 0).length)),
                'empty', await T(p, () => p.locator('.cams .empty').count()), 'official', await T(p, () => p.locator('.g-fill.official').count()));
              console.log(tag, await T(p, () => p.$$eval('.g-row', r => r.map(x => x.innerText.replace(/\s+/g, ' ')).join(' | '))));
              await p.screenshot({ path: `shot-${tag}-${name}.png`, fullPage: name === 'desk' });
              if (name === 'desk') { await T(p, () => p.click('.cams .cam[data-area="gardena"]', { timeout: 3000 })); await p.waitForTimeout(4000); await p.screenshot({ path: `shot-${tag}-detail.png` }); }
              await p.close();
            }
            await b.close();
          })();
          JS
          node shot.js
      - name: Save screenshots
        run: |
          mkdir -p probe-shots && mv shot-*.png probe-shots/
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add probe-shots && git commit -m "probe screenshots" && git push
